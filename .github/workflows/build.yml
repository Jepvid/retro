name: build
on:
  pull_request:
  push:
    branches:
    - main
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  pull-requests: write
jobs:
  build-macos:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4
    - uses: subosito/flutter-action@v2
      with:
        channel: 'stable' # or: 'beta', 'dev' or 'master'
        cache: true
        cache-key: 'flutter-:os:-:channel:-:version:-:arch:-:hash:' # optional, change this to force refresh cache
        cache-path: '${{ runner.tool_cache }}/flutter/:channel:-:version:-:arch:' # optional, change this to specify the cache path
    - run: chmod +x ./build.sh
    - run: ./build.sh
    - run: flutter config --enable-macos-desktop
    - run: flutter build -v macos --release
    - run: ditto -c -k --sequesterRsrc --keepParent retro.app $GITHUB_WORKSPACE/retro.zip
      working-directory: build/macos/Build/Products/Release
    - uses: actions/upload-artifact@v4
      with:
        name: macos
        path: retro.zip
  build-windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - uses: subosito/flutter-action@v2
      with:
        channel: 'stable' # or: 'beta', 'dev' or 'master'
        cache: true
        cache-key: 'flutter-:os:-:channel:-:version:-:arch:-:hash:' # optional, change this to force refresh cache
        cache-path: '${{ runner.tool_cache }}/flutter/:channel:-:version:-:arch:' # optional, change this to specify the cache path
    - run: ./build.ps1
    - run: flutter config --enable-windows-desktop
    - run: flutter build windows --release
    - uses: actions/upload-artifact@v4
      with:
        name: windows
        path: build/windows/x64/runner/Release/*
  build-linux:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install dependencies
      run: sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev fuse libfuse2
    - uses: subosito/flutter-action@v2
      with:
        channel: 'stable' # or: 'beta', 'dev' or 'master'
        cache: true
        cache-key: 'flutter-:os:-:channel:-:version:-:arch:-:hash:' # optional, change this to force refresh cache
        cache-path: '${{ runner.tool_cache }}/flutter/:channel:-:version:-:arch:' # optional, change this to specify the cache path
    - run: chmod +x ./build.sh
    - run: ./build.sh
    - run: flutter config --enable-linux-desktop
    - run: flutter build linux --release
    - name: Create AppImage
      run: |
        wget "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage"
        chmod a+x appimagetool-x86_64.AppImage

        # Create AppDir
        cp -r build/linux/x64/release/bundle/ retro.AppDir
        cp assets/icon-macos.png retro.AppDir/retro.png

        # Create AppRun
        echo '#!/bin/sh' > retro.AppDir/AppRun
        echo 'cd "$(dirname "$0")"' >> retro.AppDir/AppRun
        echo 'exec ./retro' >> retro.AppDir/AppRun
        chmod a+x retro.AppDir/AppRun

        # Create Desktop file
        echo '[Desktop Entry]' > retro.AppDir/retro.desktop
        echo 'Version=1.0' >> retro.AppDir/retro.desktop
        echo 'Name=retro' >> retro.AppDir/retro.desktop
        echo 'Exec=retro %u' >> retro.AppDir/retro.desktop
        echo 'Icon=retro' >> retro.AppDir/retro.desktop
        echo 'Terminal=false' >> retro.AppDir/retro.desktop
        echo 'Type=Application' >> retro.AppDir/retro.desktop
        echo 'Categories=Utility;' >> retro.AppDir/retro.desktop

        # Create AppImage
        ./appimagetool-x86_64.AppImage retro.AppDir retro.AppImage

    - uses: actions/upload-artifact@v4
      with:
        name: linux
        path: retro.AppImage
  update-nightly-links:
    if: github.event_name == 'pull_request'
    needs: [build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/github-script@v7
      with:
        script: |
          const { owner, repo } = context.repo;
          const pull_number = context.issue.number;
          const runId = context.runId;
          const base = `https://nightly.link/${owner}/${repo}/actions/runs/${runId}`;

          const startMarker = '<!-- nightly-build-links:start -->';
          const endMarker = '<!-- nightly-build-links:end -->';
          const section = [
            startMarker,
            '### Nightly build downloads',
            `- [macOS](${base}/macos.zip)`,
            `- [Windows](${base}/windows.zip)`,
            `- [Linux (AppImage)](${base}/linux.zip)`,
            '',
            `Built from ${context.sha.substring(0, 7)}`,
            endMarker,
          ].join('\n');

          const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number });
          const oldBody = pr.body || '';
          const sectionRegex = new RegExp(`${startMarker}[\\s\\S]*?${endMarker}`);

          const newBody = sectionRegex.test(oldBody)
            ? oldBody.replace(sectionRegex, section)
            : `${oldBody}\n\n${section}`.trim();

          await github.rest.pulls.update({ owner, repo, pull_number, body: newBody });
